name: CI

on:
  pull_request:
  push:
    branches:
      - feat/initial_dev
      - feat/refactor-inicial

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: make lint

      - name: Static analysis
        run: make analyze