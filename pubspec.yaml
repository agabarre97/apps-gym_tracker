name: gym_tracker
description: Gym tracker app with hexagonal architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.2.2
  table_calendar: ^3.1.3
  uuid: ^4.5.1
  fl_chart: ^1.1.1
  share_plus: ^12.0.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^6.3.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  printing: ^5.14.2
  flutter_svg: ^2.2.3
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1A1A1A"
  image: "assets/images/app_icon.png"
  android_12:
    color: "#1A1A1A"
    image: "assets/images/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/muscles/
    - assets/fonts/
    - assets/data/
    - assets/data/musclewiki/svg_templates/
    - assets/data/musclewiki/by_muscle/
    - assets/data/mobility_routines/
    - assets/data/mobility_exercises_info/
