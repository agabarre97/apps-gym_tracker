name: gym_tracker
description: Gym tracker app with hexagonal architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.2.2
  table_calendar: ^3.1.3
  uuid: ^4.5.1
  fl_chart: ^1.1.1
  share_plus: ^12.0.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^7.2.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/muscles/
    - assets/fonts/
    - assets/data/
    - assets/data/mobility_routines/
    - assets/data/mobility_exercises_info/
